<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Committee | ADIS Round Square</title>
  <meta name="description" content="Meet the ADIS Round Square Committee and find out who to contact.">
  <link rel="icon" href="assets/round-square-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=11">
</head>
<body data-page="committee">
  <header id="site-header"></header>

  <main>
    <section class="page-intro">
      <div class="wrap">
        <div>
          <h1 class="display">The committee</h1>
          <p class="lead">Students and teachers who run Round Square at ADIS.</p>
        </div>
        <figure class="plate">
          <span class="crop" aria-hidden="true"></span>
          <canvas id="circle-canvas" class="ascii" role="img" aria-label="The Round Square circle in its square, drawn in text characters, with the six IDEALS circling inside"></canvas>
          <figcaption><b>Fig. 3</b>The circle in the square, with the six IDEALS in orbit.</figcaption>
        </figure>
      </div>
    </section>

    <section class="block" style="padding-top:32px">
      <div class="wrap">
        <div class="toolbar">
          <label class="search">
            <span class="visually-hidden">Search the committee</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="Search by name, role or IDEAL" autocomplete="off">
          </label>
          <div class="chips" id="group-filter" role="group" aria-label="Filter by group"></div>
        </div>
        <div id="members"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js?v=11"></script>
  <script src="js/main.js?v=11"></script>
  <script src="js/ascii.js?v=11"></script>
  <script src="js/committee.js?v=11"></script>
</body>
</html>
