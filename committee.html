<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Committee · ADIS Round Square</title>
  <meta name="description" content="Meet the ADIS Round Square Committee and find out who to contact.">
  <link rel="icon" href="assets/round-square-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="committee">
  <header id="site-header"></header>

  <main>
    <section class="page-intro">
      <svg class="deco" viewBox="0 0 200 200" aria-hidden="true">
        <rect width="200" height="200" fill="#d59600"/><rect x="6" y="6" width="188" height="188" fill="#e60048"/>
        <circle cx="100" cy="100" r="70" fill="#fff"/><circle cx="100" cy="100" r="24" fill="#7f3286"/>
      </svg>
      <div class="wrap">
        <h1 class="display">The committee</h1>
        <p class="lead">Students and staff who run Round Square at ADIS. Tap a card to flip it for contact details. Got an idea? Write to any of us.</p>
      </div>
    </section>

    <section class="block" style="padding-top:48px">
      <div class="wrap">
        <div class="toolbar">
          <label class="search">
            <span class="visually-hidden">Search the committee</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="Search by name, role or IDEAL" autocomplete="off">
          </label>
          <div class="chips" id="group-filter" role="group" aria-label="Filter by group"></div>
        </div>
        <div id="members"></div>

        <div class="contact-strip">
          <div>
            <p class="title">Want to join the committee?</p>
            <p class="caption" style="margin:4px 0 0">Elections for IDEAL leads are held every April.</p>
          </div>
          <a class="btn primary" id="mail-all" href="#">Email the committee</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/committee.js"></script>
</body>
</html>
